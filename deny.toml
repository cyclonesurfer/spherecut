# cargo-deny configuration. Run with `cargo xtask check` or `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything here is compatible with distributing Spherecut under
# GPL-3.0-or-later. Add to this list only after checking compatibility and
# recording the reason in DECISIONS.md.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# WTFPL is GPL-compatible (FSF license list); allowed only for the FFmpeg
# bindings. See DECISIONS.md D2, "FFmpeg through ffmpeg-next".
exceptions = [
    { crate = "ffmpeg-next", allow = ["WTFPL"] },
    { crate = "ffmpeg-sys-next", allow = ["WTFPL"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Runtime must never touch the network, and the build must stay free of
# webviews and JavaScript tooling.
deny = [
    { crate = "reqwest", reason = "no network access at runtime" },
    { crate = "hyper", reason = "no network access at runtime" },
    { crate = "ureq", reason = "no network access at runtime" },
    { crate = "isahc", reason = "no network access at runtime" },
    { crate = "curl", reason = "no network access at runtime" },
    { crate = "minreq", reason = "no network access at runtime" },
    { crate = "attohttpc", reason = "no network access at runtime" },
    { crate = "rustls", reason = "no network access at runtime" },
    { crate = "native-tls", reason = "no network access at runtime" },
    { crate = "openssl", reason = "no network access at runtime" },
    { crate = "wry", reason = "no webviews" },
    { crate = "tauri", reason = "no webviews" },
    { crate = "webkit2gtk", reason = "no webviews" },
    { crate = "v8", reason = "no JavaScript" },
    { crate = "deno_core", reason = "no JavaScript" },
    { crate = "boa_engine", reason = "no JavaScript" },
    { crate = "rquickjs", reason = "no JavaScript" },
    { crate = "quick-js", reason = "no JavaScript" },
    { crate = "mozjs", reason = "no JavaScript" },
]

# Features that must not come back through another crate (D21, D31).
# wgpu runs on Vulkan with WGSL only: its web, WebGPU and WebGL features are
# browser bindings (wasm-bindgen, js-sys, web-sys), ANGLE and DXC are
# Windows paths, and the SPIR-V and GLSL front ends read shaders
# Spherecut doesn't have. Its GL, Metal and DX12 features are not listed:
# egui_kittest turns them on in test builds (m1-plan section 11), and on
# Linux only GL builds anything; our instance asks for Vulkan only.
[[bans.features]]
crate = "wgpu"
deny = ["web", "webgpu", "webgl", "angle", "glsl", "spirv", "static-dxc", "vulkan-portability"]

# PNG only: no other codec, no rayon (D22).
[[bans.features]]
crate = "image"
allow = ["png"]

# The PulseAudio protocol host only, with ALSA, which cpal always builds
# on Linux (D35): `pipewire` and `jack` link libraries no build machine
# should need, `asio` is Windows, `audioworklet` and `wasm-bindgen` are
# browser bindings, and `realtime` asks the system for real-time priority
# over D-Bus.
[[bans.features]]
crate = "cpal"
allow = ["pulseaudio"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
