[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/cyclonesurfer/spherecut"
publish = false

[workspace.dependencies]
spherecut-core = { path = "crates/core" }
spherecut-sphere = { path = "crates/sphere" }
spherecut-media = { path = "crates/media" }
spherecut-testkit = { path = "crates/testkit" }
spherecut-cli = { path = "crates/cli" }
spherecut-synth = { path = "crates/synth" }
spherecut-render = { path = "crates/render" }
spherecut-playback = { path = "crates/playback" }
spherecut-audio = { path = "crates/audio" }
spherecut-app = { path = "crates/app" }

anyhow = "1.0.100"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
# Audio output (D35): the PulseAudio protocol host, pure Rust, reaching
# PipeWire through pipewire-pulse, and ALSA, which cpal always builds on
# Linux and which links libasound. Not `pipewire` or `jack`: both need
# libraries at build time that no build machine should need (D35).
cpal = { version = "=0.18.2", default-features = false, features = ["pulseaudio"] }
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
ffmpeg-sys-next = { version = "=9.0.1", default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }
glam = { version = "0.34", features = ["serde"] }
# The GUI (D7, D22, m1-plan section 11), pinned with `=`: egui and wgpu
# move in lockstep. eframe without its defaults: wgpu without wgpu's own
# defaults (Vulkan only), Wayland and X11, egui's fonts (the deny.toml
# exception), copying for the doctor banner and persistence for the
# layout; never accesskit (zbus advisories), links (opens a browser),
# system_fonts or glow.
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features", "wayland", "x11", "default_fonts", "persistence", "clipboard"] }
egui = "=0.37.0"
egui-wgpu = { version = "=0.37.0", default-features = false }
egui_tiles = "=0.18.0"
# Tests only: kittest on lavapipe through our own device. Its `wgpu`
# feature turns on wgpu's GL, Metal and DX12 features in test builds;
# the shipped binary has none of them.
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
# Only to turn `wayland-dlopen` back on, which eframe without its
# defaults drops (no libwayland at build time); never
# `wayland-csd-adwaita` (RUSTSEC-2026-0192 through ttf-parser).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
# PNG only: 8- and 16-bit output and golden images (D22).
image = { version = "0.25.10", default-features = false, features = ["png"] }
# sigaction for frame's SIGINT handler (D22, D28). Already in the tree.
libc = "0.2.191"
# The WGSL front end only, for the uniform layout test (D31). Already in
# the tree through wgpu, at the same version.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
pollster = "1.0.1"
proptest = "1.8"
ron = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.41"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# Vulkan only, WGSL only (D7, D31): no GL, Metal, DX12 or WebGPU backend,
# no SPIR-V or GLSL front end. Pinned with `=`: wgpu moves with egui (D7).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Pattern rendering and projection math are hot loops in tests and in
# `cargo xtask gen-media`; keep them fast in dev builds too.
[profile.dev.package.spherecut-synth]
opt-level = 3

[profile.dev.package.spherecut-sphere]
opt-level = 3

# The f64 CPU reference and the goldens' ideal and metrics are hot loops
# in the render tests (DECISIONS D32).
[profile.dev.package.spherecut-render]
opt-level = 2

[profile.dev.package.spherecut-testkit]
opt-level = 2
