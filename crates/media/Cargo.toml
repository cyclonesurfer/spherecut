[package]
name = "spherecut-media"
description = "FFmpeg decode and encode, hardware devices, probing, doctor checks, MP4 metadata boxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spherecut-camera.workspace = true
spherecut-core.workspace = true
# The binding and status of the geometry camera's built-in table gives,
# which probe reports (M3 plan 5.4). camera depends on it already.
spherecut-sphere.workspace = true
ffmpeg-next.workspace = true
ffmpeg-sys-next.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-core.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
# Tests only: `VideoRequest::fault` fails a frame "as hardware", to test
# the fallback to software (DECISIONS D30), and `FfmpegAudio::open_faulted`
# drops the priming at open as some demuxers do, or hands out what a seek
# decodes before the stream's first sample, for a control. Only test
# builds turn it on, through dev-dependencies.
fault-injection = []

[dev-dependencies]
proptest.workspace = true
spherecut-testkit.workspace = true

[lints]
workspace = true
