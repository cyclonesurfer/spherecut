[package]
name = "spherecut-app"
description = "The GUI viewer: eframe on render's device, the viewer pane, transport and the side panes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_tiles.workspace = true
glam.workspace = true
# The smoke run's screenshot, downscaled and written as a PNG.
image.workspace = true
serde.workspace = true
# The smoke run's JSON; the settings' tests.
serde_json.workspace = true
spherecut-audio.workspace = true
spherecut-core.workspace = true
# The export window runs its jobs (M2 plan section 10.6).
spherecut-export.workspace = true
spherecut-media.workspace = true
spherecut-playback.workspace = true
spherecut-render.workspace = true
spherecut-sphere.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
# Named so that eframe's winit gets `wayland-dlopen` (libwayland loaded at
# run time) by feature unification (D34); the smoke run reads the
# monitor's refresh rate through it.
winit.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# An agent's calls beside the window, on the same project (tests/agents.rs).
spherecut-agent.workspace = true
spherecut-synth.workspace = true
# The fallback notice's test fails a frame "as hardware" (tests/panes.rs);
# only here, so only test builds have fault injection (DECISIONS D30).
spherecut-media = { workspace = true, features = ["fault-injection"] }

[lints]
workspace = true
