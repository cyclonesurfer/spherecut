[package]
name = "spherecut-synth"
description = "Synthetic test media: spherical test patterns, tones, ambiX, broken files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
spherecut-core.workspace = true
spherecut-media.workspace = true
spherecut-sphere.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The fallback tests fail frames "as hardware" (tests/fallback.rs); only
# here, so only test builds have fault injection (DECISIONS D30).
spherecut-media = { workspace = true, features = ["fault-injection"] }
# Pat's truths and the boundary to sphere's types (F137), for the
# integration tests only: boundary depends on this crate, so a unit test
# that used it would see a second copy of this crate's types.
spherecut-boundary.workspace = true
# The geometry table and the trailer's calibration, which tests/project.rs
# holds a camera file's source to (M3 plan 11.4 and 11.5).
spherecut-camera.workspace = true
spherecut-testkit.workspace = true
